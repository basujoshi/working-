<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Super Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#07111f;color:#eef6ff}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#0d1b2a;border:1px solid #21364d;border-radius:20px;padding:18px;margin:12px 0}input,select,button,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2c4560;background:#091522;color:white}button{background:#1677ff;border:0;font-weight:700;cursor:pointer;margin-top:7px}button.danger{background:#d83a52}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none!important}.muted{color:#9eb1c5}.err{padding:10px;background:#381621;color:#ff9aaa;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #23384c;text-align:left;font-size:13px}img{object-fit:cover}.avatar{width:70px;height:70px;border-radius:50%}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>Super Admin Login</h1><p class="muted">Google account login</p><button id="google">Continue with Google</button><div id="msg"></div></div>
<div id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Attendance Admin</h1><div id="adminInfo" class="muted"></div></div><button id="logout" class="danger" style="width:auto">Logout</button></div></div>
<div class="grid">
<div class="card"><h2>Company</h2><input id="cid" placeholder="Company ID"><input id="cname" placeholder="Company name"><input id="caddress" placeholder="Address"><label>Logo / background file</label><input id="cfile" type="file" accept="image/*"><button id="saveCompany">Save Company</button><div class="muted">File is stored as compressed data in RTDB. Keep images reasonably small.</div></div>
<div class="card"><h2>Employee</h2><input id="eid" placeholder="Employee ID"><input id="ename" placeholder="Full name"><input id="eusername" placeholder="Username"><input id="epassword" type="password" placeholder="Password (new employee)"><input id="ephone" placeholder="Phone"><input id="edesignation" placeholder="Designation"><input id="ebranch" placeholder="Branch ID"><input id="ecompany" placeholder="Company ID"><label>Employee photo</label><input id="efile" type="file" accept="image/*"><button id="saveEmployee">Create / Update Employee</button><div id="employeeMsg"></div></div>
</div>
<div class="card"><h2>Companies</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Address</th><th>Action</th></tr></thead><tbody id="companyRows"></tbody></table></div></div>
<div class="card"><h2>Employees</h2><input id="employeeSearch" placeholder="Search ID/name/company..."><div style="overflow:auto"><table><thead><tr><th>Photo</th><th>ID</th><th>Name</th><th>Company</th><th>Branch</th><th>Designation</th><th>Action</th></tr></thead><tbody id="employeeRows"></tbody></table></div></div>
<div class="card"><h2>Attendance</h2><input id="attDate" type="date"><input id="attUid" placeholder="Employee UID (optional)"><button id="loadAttendance">Load Attendance</button><div style="overflow:auto"><table><thead><tr><th>Employee</th><th>Date</th><th>In</th><th>Out</th><th>Minutes</th><th>GPS</th><th>Edit</th></tr></thead><tbody id="attRows"></tbody></table></div></div>
</div></div>
<script type="module">
import {initializeApp, getApps} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,get,set,update,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getStorage,ref as sref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyC0A0C8ZAlYUZQM4UYs49xBhyMHwArJDLpA",
  authDomain: "website-a091e.firebaseapp.com",
  databaseURL: "https://website-a091e-default-rtdb.firebaseio.com",
  projectId: "website-a091e",
  storageBucket: "website-a091e.firebasestorage.app",
  messagingSenderId: "204226900375",
  appId: "1:204226900375:web:d635dc3888d304ec4b14d2",
  measurementId: "G-FWWR65M866"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app),storage=getStorage(app);
setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id); let companies={},users={};
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fileData(file,max=900){return new Promise((res,rej)=>{if(!file)return res("");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),scale=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$("google").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("msg").innerHTML='<div class="err">'+esc(e.message)+'</div>'}};
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return};$("login").classList.add("hidden");$("app").classList.remove("hidden");$("adminInfo").textContent=u.email||"Google Admin";await loadAll()});
$("logout").onclick=()=>signOut(auth);
async function loadAll(){const [c,u]=await Promise.all([get(ref(db,"companies")),get(ref(db,"users"))]);companies=c.exists()?c.val():{};users=u.exists()?u.val():{};renderCompanies();renderEmployees();}
function renderCompanies(){$("companyRows").innerHTML=Object.entries(companies).map(([id,v])=>`<tr><td>${esc(id)}</td><td>${esc(v.name||v.companyName||v.shopName)}</td><td>${esc(v.address||"")}</td><td><button onclick="editCompany('${id}')">Edit</button></td></tr>`).join("")||"<tr><td colspan=4>No companies</td></tr>";}
window.editCompany=id=>{const v=companies[id]||{};$("cid").value=id;$("cname").value=v.name||v.companyName||v.shopName||"";$("caddress").value=v.address||""};
$("saveCompany").onclick=async()=>{const id=$("cid").value.trim();if(!id)return alert("Company ID required");let old=companies[id]||{};let logo=await fileData($("cfile").files[0]);await set(ref(db,"companies/"+id),{...old,name:$("cname").value.trim(),address:$("caddress").value.trim(),logo:logo||old.logo||"",updatedAt:Date.now()});await loadAll();alert("Company saved");};
function renderEmployees(){const q=$("employeeSearch").value.toLowerCase();$("employeeRows").innerHTML=Object.entries(users).filter(([uid,v])=>{const s=[uid,v.employeeId,v.name,v.companyId,v.branchId].join(" ").toLowerCase();return s.includes(q)}).map(([uid,v])=>`<tr><td><img class="avatar" src="${esc(v.photo||"")}"></td><td>${esc(v.employeeId)}</td><td>${esc(v.name||v.fullName)}</td><td>${esc(v.companyId)}</td><td>${esc(v.branchId)}</td><td>${esc(v.designation)}</td><td><button onclick="editEmployee('${uid}')">Edit</button><button class="danger" onclick="deleteEmployee('${uid}')">Delete</button></td></tr>`).join("")||"<tr><td colspan=7>No employees</td></tr>";}
$("employeeSearch").oninput=renderEmployees;
window.editEmployee=uid=>{const v=users[uid]||{};["eid","ename","eusername","ephone","edesignation","ebranch","ecompany"].forEach(()=>{});$("eid").value=v.employeeId||"";$("ename").value=v.name||v.fullName||"";$("ephone").value=v.phone||"";$("edesignation").value=v.designation||"";$("ebranch").value=v.branchId||"";$("ecompany").value=v.companyId||"";$("eusername").value=v.username||"";$("employeeMsg").textContent="Editing existing profile. Password field only changes password when creating a new account.";$("eid").dataset.uid=uid};
window.deleteEmployee=async uid=>{if(!confirm("Delete employee profile?"))return;await remove(ref(db,"users/"+uid));await loadAll()};
$("saveEmployee").onclick=async()=>{try{const id=$("eid").value.trim(),name=$("ename").value.trim(),username=$("eusername").value.trim().toLowerCase(),companyId=$("ecompany").value.trim();if(!id||!name||!username||!companyId)throw Error("Employee ID, name, username and company ID required.");let uid=$("eid").dataset.uid||"";let old=uid?users[uid]:null;
if(!uid){if(!$("epassword").value)throw Error("Password required for new employee.");const secName="employeeCreate_"+Date.now();const sec=initializeApp(firebaseConfig,secName);const sa=(await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"));const aa=sa.getAuth(sec);await sa.setPersistence(aa,sa.browserLocalPersistence);const cr=await sa.createUserWithEmailAndPassword(aa,username+"@bdbajar.local",$("epassword").value);uid=cr.user.uid;await sa.signOut(aa);}
let p=await fileData($("efile").files[0]);const obj={...(old||{}),employeeId:id,name,username,phone:$("ephone").value.trim(),designation:$("edesignation").value.trim(),branchId:$("ebranch").value.trim(),companyId,role:"employee",photo:p||(old?.photo||""),updatedAt:Date.now()};await set(ref(db,"users/"+uid),obj);await set(ref(db,"employeeIndex/"+id),{uid,...obj});delete $("eid").dataset.uid;await loadAll();alert("Employee saved");}catch(e){$("employeeMsg").innerHTML='<div class="err">'+esc(e.message)+'</div>'}};
$("loadAttendance").onclick=async()=>{const date=$("attDate").value||new Date().toISOString().slice(0,10);let rows=[];if($("attUid").value.trim()){const uid=$("attUid").value.trim(),s=await get(ref(db,`attendance/${uid}/${date}`));if(s.exists())rows.push([uid,date,s.val()])}else{const a=await get(ref(db,"attendance"));if(a.exists())for(const [uid,days] of Object.entries(a.val()))if(days[date])rows.push([uid,date,days[date]])}$("attRows").innerHTML=rows.map(([uid,d,v])=>`<tr><td>${esc(users[uid]?.name||uid)}</td><td>${d}</td><td>${esc(v.checkIn||"")}</td><td>${esc(v.checkOut||"")}</td><td>${esc(v.workingMinutes||"")}</td><td>${v.lat?esc(v.lat+", "+v.lng):"-"}</td><td><button onclick="editAtt('${uid}','${d}')">Edit</button></td></tr>`).join("")||"<tr><td colspan=7>No attendance</td></tr>";};
window.editAtt=async(uid,d)=>{const s=await get(ref(db,`attendance/${uid}/${d}`));if(!s.exists())return;const v=s.val();const ci=prompt("Check-in time:",v.checkIn||"");if(ci===null)return;const co=prompt("Check-out time:",v.checkOut||"");if(co===null)return;await update(ref(db,`attendance/${uid}/${d}`),{checkIn:ci,checkOut:co,adminEditedAt:Date.now()});$("loadAttendance").click()};
</script></body></html>
